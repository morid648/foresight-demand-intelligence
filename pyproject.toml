[project]
name = "foresight-demand-intelligence"
version = "1.0.0"
description = "AI-Powered Demand & Inventory Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0"
]

[tool.vercel]
entrypoint = "api/index.py"
